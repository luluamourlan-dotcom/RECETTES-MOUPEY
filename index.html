<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carnet de recettes famille MOUPEY</title>


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --fond: #f3eee5;

            --papier: #fffdf8;

            --texte: #29251f;

            --texte-clair: #756e63;

            --accent: #7a4328;

            --accent-clair: #eadbca;

            --bordure: #ded5c8;

        }


        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background: var(--fond);

            color: var(--texte);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            line-height: 1.6;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =====================================================
           EN-TETE
        ===================================================== */

        header {

            background: var(--accent);

            color: white;

            text-align: center;

            padding: 45px 20px 40px;

        }


        header h1 {

            margin: 0;

            font-size: clamp(30px, 5vw, 48px);

            letter-spacing: 1px;

            font-weight: normal;

        }


        header p {

            margin: 8px 0 0;

            font-size: 17px;

            opacity: 0.9;

        }


        /* =====================================================
           CONTENU PRINCIPAL
        ===================================================== */

        .conteneur {

            width: min(1100px, 92%);

            margin: 45px auto;

        }


        /* =====================================================
           TITRES
        ===================================================== */

        .titre-section {

            text-align: center;

            margin-bottom: 30px;

        }


        .titre-section h2 {

            margin: 0;

            font-size: 30px;

            font-weight: normal;

        }


        .titre-section p {

            margin-top: 5px;

            color: var(--texte-clair);

        }


        /* =====================================================
           RECHERCHE
        ===================================================== */

        .recherche {

            width: 100%;

            padding: 15px 18px;

            border: 1px solid var(--bordure);

            border-radius: 6px;

            background: white;

            font-size: 17px;

            outline: none;

            margin-bottom: 18px;

        }


        .recherche:focus {

            border-color: var(--accent);

        }


        /* =====================================================
           CATEGORIES
        ===================================================== */

        .categories {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 35px;

        }


        .categorie {

            background: transparent;

            border: 1px solid var(--accent);

            color: var(--accent);

            padding: 8px 18px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 15px;

        }


        .categorie:hover,
        .categorie.active {

            background: var(--accent);

            color: white;

        }


        /* =====================================================
           GRILLE DES RECETTES
        ===================================================== */

        .recettes {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(270px, 1fr));

            gap: 25px;

        }


        /* =====================================================
           CARTE RECETTE
        ===================================================== */

        .carte {

            background: var(--papier);

            border: 1px solid var(--bordure);

            border-radius: 5px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .carte:hover {

            transform: translateY(-4px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);

        }


        .carte img {

            width: 100%;

            height: 190px;

            object-fit: cover;

            display: block;

        }


        .carte-contenu {

            padding: 20px;

        }


        .carte-contenu h3 {

            margin: 7px 0;

            font-size: 22px;

            font-weight: normal;

        }


        .carte-contenu p {

            margin: 0;

            color: var(--texte-clair);

        }


        .badge {

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: var(--accent);

        }


        /* =====================================================
           AUCUN RESULTAT
        ===================================================== */

        .aucun-resultat {

            display: none;

            text-align: center;

            padding: 50px;

            color: var(--texte-clair);

        }


        /* =====================================================
           PAGE RECETTE
        ===================================================== */

        #page-recette {

            display: none;

        }


        /* =====================================================
           FICHE RECETTE
        ===================================================== */

        .fiche-recette {

            background: var(--papier);

            border: 1px solid var(--bordure);

            max-width: 850px;

            margin: 0 auto;

            padding: clamp(25px, 5vw, 60px);

            box-shadow:
                0 5px 25px rgba(0,0,0,0.06);

        }


        /* =====================================================
           EN-TETE DE LA RECETTE
        ===================================================== */

        .recette-date {

            text-align: center;

            color: var(--texte-clair);

            font-size: 14px;

            margin-bottom: 5px;

        }


        .recette-titre {

            text-align: center;

            text-transform: uppercase;

            font-size: clamp(32px, 6vw, 52px);

            font-weight: normal;

            letter-spacing: 2px;

            margin: 5px 0 20px;

            color: var(--accent);

        }


        .recette-image {

            width: 100%;

            max-height: 450px;

            object-fit: cover;

            display: block;

            margin: 0 auto 35px;

        }


        /* =====================================================
           INFORMATIONS
        ===================================================== */

        .recette-personnes {

            text-align: center;

            font-size: 19px;

            margin-bottom: 30px;

        }


        /* =====================================================
           VARIANTE
        ===================================================== */

        .variante {

            border-left: 4px solid var(--accent);

            background: #f7f1e9;

            padding: 18px 22px;

            margin-bottom: 35px;

        }


        .variante-titre {

            font-weight: bold;

            color: var(--accent);

            margin-bottom: 5px;

        }


        .variante p {

            margin: 0;

        }


        /* =====================================================
           SECTIONS
        ===================================================== */

        .section-recette {

            margin-top: 35px;

        }


        .section-recette h2 {

            text-transform: uppercase;

            text-align: center;

            font-size: 24px;

            letter-spacing: 2px;

            font-weight: normal;

            color: var(--accent);

            margin-bottom: 25px;

        }


        /* =====================================================
           INGREDIENTS
        ===================================================== */

        .categorie-ingredients {

            margin-bottom: 25px;

        }


        .categorie-ingredients h3 {

            font-size: 18px;

            font-weight: normal;

            margin: 0 0 8px;

            color: var(--accent);

        }


        .categorie-ingredients h3::before {

            content: "✦ ";

        }


        .ingredients {

            list-style: none;

            margin: 0;

            padding: 0;

        }


        .ingredients li {

            margin: 4px 0;

            padding-left: 20px;

            position: relative;

        }


        .ingredients li::before {

            content: "•";

            position: absolute;

            left: 3px;

            color: var(--accent);

        }


        /* =====================================================
           PREPARATION
        ===================================================== */

        .preparation p {

            margin: 0 0 18px;

            text-align: justify;

        }


        .fin-recette {

            text-align: center;

            font-size: 20px;

            font-style: italic;

            color: var(--accent);

            margin-top: 35px;

        }


        /* =====================================================
           BOUTON RETOUR
        ===================================================== */

        .bouton-retour {

            display: block;

            width: fit-content;

            margin: 25px auto;

            padding: 10px 20px;

            background: transparent;

            border: 1px solid var(--accent);

            color: var(--accent);

            border-radius: 4px;

            cursor: pointer;

            font-size: 15px;

        }


        .bouton-retour:hover {

            background: var(--accent);

            color: white;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            color: var(--texte-clair);

            padding: 30px;

            font-size: 14px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .fiche-recette {

                padding: 25px 20px;

            }


            .recette-titre {

                font-size: 32px;

                letter-spacing: 1px;

            }


            .preparation p {

                text-align: left;

            }

        }


        /* =====================================================
           IMPRESSION
        ===================================================== */

        @media print {

            body {

                background: white;

            }


            header,
            #sommaire,
            .bouton-retour,
            footer {

                display: none !important;

            }


            #page-recette {

                display: block !important;

            }


            .fiche-recette {

                box-shadow: none;

                border: none;

                max-width: none;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     EN-TETE
========================================================= -->

<header>

    <h1>🍴 Mon carnet de recettes</h1>

    <p>
        Mes recettes, mes classiques et mes découvertes
    </p>

</header>



<!-- =========================================================
     SOMMAIRE
========================================================= -->

<main
    id="sommaire"
    class="conteneur"
>

    <div class="titre-section">

        <h2>
            📖 Le carnet de recettes
        </h2>

        <p>
            Retrouvez toutes mes recettes
        </p>

    </div>


    <!-- RECHERCHE -->

    <input
        type="text"
        id="recherche"
        class="recherche"
        placeholder="🔎 Rechercher une recette, un ingrédient..."
    >


    <!-- CATEGORIES -->

    <div
        id="categories"
        class="categories"
    >

    </div>


    <!-- LISTE -->

    <div
        id="liste-recettes"
        class="recettes"
    >

    </div>


    <!-- AUCUN RESULTAT -->

    <div
        id="aucun-resultat"
        class="aucun-resultat"
    >

        Aucune recette ne correspond à votre recherche.

    </div>

</main>



<!-- =========================================================
     PAGE RECETTE
========================================================= -->

<main
    id="page-recette"
    class="conteneur"
>


    <button
        class="bouton-retour"
        onclick="retourSommaire()"
    >

        ← Retour au sommaire

    </button>


    <article class="fiche-recette">


        <!-- DATE -->

        <div
            id="recette-date"
            class="recette-date"
        >
        </div>


        <!-- TITRE -->

        <h1
            id="recette-titre"
            class="recette-titre"
        >
        </h1>


        <!-- PHOTO -->

        <img
            id="recette-image"
            class="recette-image"
            src=""
            alt=""
        >


        <!-- NOMBRE DE PERSONNES -->

        <div
            id="recette-personnes"
            class="recette-personnes"
        >
        </div>


        <!-- VARIANTE -->

        <div
            id="recette-variante"
            class="variante"
            style="display: none;"
        >

            <div
                id="variante-titre"
                class="variante-titre"
            >
            </div>

            <p
                id="variante-texte"
            >
            </p>

        </div>


        <!-- =================================================
             INGREDIENTS
        ================================================== -->

        <section class="section-recette">

            <h2>
                Ingrédients
            </h2>


            <div
                id="recette-ingredients"
            >
            </div>

        </section>



        <!-- =================================================
             PREPARATION
        ================================================== -->

        <section
            class="section-recette"
        >

            <h2>
                Préparation
            </h2>


            <div
                id="recette-preparation"
                class="preparation"
            >
            </div>

        </section>



        <!-- =================================================
             FIN
        ================================================== -->

        <div
            id="recette-fin"
            class="fin-recette"
        >
        </div>


    </article>


    <button
        class="bouton-retour"
        onclick="retourSommaire()"
    >

        ← Retour au sommaire

    </button>


</main>



<footer>

    Mon carnet de recettes

</footer>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="recettes.js"></script>


</body>

</html>
