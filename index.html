<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon carnet de recettes</title>


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --fond: #f3eee5;

            --papier: #fffdf8;

            --texte: #29251f;

            --texte-clair: #756e63;

            --accent: #7a4328;

            --bordure: #ded5c8;

        }


        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background: var(--fond);

            color: var(--texte);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            background: var(--accent);

            color: white;

            text-align: center;

            padding: 45px 20px;

        }


        header h1 {

            margin: 0;

            font-size: clamp(30px, 5vw, 48px);

            font-weight: normal;

            letter-spacing: 1px;

        }


        header p {

            margin: 8px 0 0;

            font-size: 17px;

            opacity: 0.9;

        }


        /* =====================================================
           CONTENEUR
        ===================================================== */

        .conteneur {

            width: min(1100px, 92%);

            margin: 45px auto;

        }


        /* =====================================================
           TITRE DU SOMMAIRE
        ===================================================== */

        .titre-section {

            text-align: center;

            margin-bottom: 30px;

        }


        .titre-section h2 {

            margin: 0;

            font-size: 30px;

            font-weight: normal;

        }


        .titre-section p {

            color: var(--texte-clair);

        }


        /* =====================================================
           RECHERCHE
        ===================================================== */

        .recherche {

            width: 100%;

            padding: 15px 18px;

            border: 1px solid var(--bordure);

            border-radius: 6px;

            background: white;

            font-size: 17px;

            outline: none;

            margin-bottom: 18px;

        }


        .recherche:focus {

            border-color: var(--accent);

        }


        /* =====================================================
           CATEGORIES
        ===================================================== */

        .categories {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 35px;

        }


        .categorie {

            background: transparent;

            border: 1px solid var(--accent);

            color: var(--accent);

            padding: 8px 18px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 15px;

        }


        .categorie:hover,
        .categorie.active {

            background: var(--accent);

            color: white;

        }


        /* =====================================================
           GRILLE DES RECETTES
        ===================================================== */

        .recettes {

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(270px, 1fr));

            gap: 25px;

        }


        /* =====================================================
           CARTE DANS LE SOMMAIRE
        ===================================================== */

        .carte {

            background: var(--papier);

            border: 1px solid var(--bordure);

            border-radius: 5px;

            overflow: hidden;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;

        }


        .carte:hover {

            transform: translateY(-4px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.12);

        }


        .carte img {

            width: 100%;

            height: 190px;

            object-fit: cover;

            display: block;

        }


        .carte-contenu {

            padding: 20px;

        }


        .carte-contenu h3 {

            margin: 7px 0;

            font-size: 22px;

            font-weight: normal;

        }


        .badge {

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            color: var(--accent);

        }


        /* =====================================================
           AUCUN RESULTAT
        ===================================================== */

        .aucun-resultat {

            display: none;

            text-align: center;

            padding: 50px;

            color: var(--texte-clair);

        }


        /* =====================================================
           PAGE RECETTE
        ===================================================== */

        #page-recette {

            display: none;

        }


        /* =====================================================
           FICHE RECETTE
        ===================================================== */

        .fiche-recette {

            background: var(--papier);

            border: 1px solid var(--bordure);

            max-width: 950px;

            margin: 0 auto;

            padding: clamp(25px, 5vw, 55px);

            box-shadow:
                0 5px 25px rgba(0,0,0,0.06);

        }


        /* =====================================================
           TITRE RECETTE
        ===================================================== */

        .recette-titre {

            text-align: center;

            text-transform: uppercase;

            font-size: clamp(30px, 5vw, 48px);

            font-weight: normal;

            letter-spacing: 2px;

            color: var(--accent);

            margin:

                0

                0

                35px;

        }


        /* =====================================================
           SCANS
        ===================================================== */

        .scans {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 30px;

        }


        .scan {

            width: 100%;

            display: block;

            height: auto;

            border: 1px solid var(--bordure);

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        /* =====================================================
           BOUTON RETOUR
        ===================================================== */

        .bouton-retour {

            display: block;

            width: fit-content;

            margin: 25px auto;

            padding: 10px 20px;

            background: transparent;

            border: 1px solid var(--accent);

            color: var(--accent);

            border-radius: 4px;

            cursor: pointer;

            font-size: 15px;

        }


        .bouton-retour:hover {

            background: var(--accent);

            color: white;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            color: var(--texte-clair);

            padding: 30px;

            font-size: 14px;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .fiche-recette {

                padding: 20px 15px;

            }


            .recette-titre {

                font-size: 30px;

            }

        }


        /* =====================================================
           IMPRESSION
        ===================================================== */

        @media print {

            body {

                background: white;

            }


            header,
            #sommaire,
            .bouton-retour,
            footer {

                display: none !important;

            }


            #page-recette {

                display: block !important;

            }


            .fiche-recette {

                box-shadow: none;

                border: none;

                max-width: none;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>
        Les recettes de la famille MOUPEY
    </h1>


</header>



<!-- =========================================================
     SOMMAIRE
========================================================= -->

<main
    id="sommaire"
    class="conteneur"
>


    <div class="titre-section">

        <h2>
            📖 Le carnet de recettes
        </h2>

        <p>
            Retrouvez toutes les recettes de la famille MOUPEY
        </p>

    </div>



    <!-- RECHERCHE -->

    <input

        type="text"

        id="recherche"

        class="recherche"

        placeholder="🔎 Rechercher une recette..."

    >



    <!-- CATEGORIES -->

    <div
        id="categories"
        class="categories"
    >
    </div>



    <!-- RECETTES -->

    <div
        id="liste-recettes"
        class="recettes"
    >
    </div>



    <!-- AUCUN RESULTAT -->

    <div
        id="aucun-resultat"
        class="aucun-resultat"
    >

        Aucune recette ne correspond
        à votre recherche.

    </div>


</main>



<!-- =========================================================
     PAGE RECETTE
========================================================= -->

<main
    id="page-recette"
    class="conteneur"
>


    <button
        class="bouton-retour"
        onclick="retourSommaire()"
    >

        ← Retour au sommaire

    </button>



    <article class="fiche-recette">


        <!-- TITRE -->

        <h1
            id="recette-titre"
            class="recette-titre"
        >
        </h1>



        <!-- SCANS -->

        <div
            id="recette-scans"
            class="scans"
        >
        </div>


    </article>



    <button
        class="bouton-retour"
        onclick="retourSommaire()"
    >

        ← Retour au sommaire

    </button>


</main>



<footer>

Les recettes de la famille MOUPEY

</footer>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="recettes.js"></script>


</body>

</html>
